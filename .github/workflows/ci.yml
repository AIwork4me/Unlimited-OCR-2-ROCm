name: CPU package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m mypy src
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --no-index --no-deps --force-reinstall --find-links dist unlimited-ocr-2-rocm
      - run: unlimited-ocr2-rocm --version
      - run: unlimited-ocr2-rocm --help
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*
