name: CPU package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src scripts tests experiments/sdpa_rca experiments/pytorch212_wheel
      - run: python -m ruff format --check src scripts tests experiments/sdpa_rca experiments/pytorch212_wheel
      - run: python -m mypy src experiments/pytorch212_wheel/compare_results.py experiments/pytorch212_wheel/collect_build_provenance.py experiments/pytorch212_wheel/validate_wheel.py experiments/pytorch212_wheel/export_evidence.py experiments/pytorch212_wheel/candidate_identity.py experiments/pytorch212_wheel/candidate_repro.py experiments/pytorch212_wheel/prepare_candidate_profile.py
      # These frozen RCA helpers describe Windows ctypes APIs on either CI host.
      - run: python -m mypy --platform win32 --allow-untyped-defs --follow-imports skip experiments/sdpa_rca/collect_provenance.py experiments/sdpa_rca/compare_backends.py experiments/sdpa_rca/export_evidence.py experiments/sdpa_rca/reporting.py
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --no-index --no-deps --force-reinstall --find-links dist unlimited-ocr-2-rocm
      - run: unlimited-ocr2-rocm --version
      - run: unlimited-ocr2-rocm --help
      - run: unlimited-ocr2-benchmark --help
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*
  scorer:
    strategy:
      matrix:
        include:
          - os: windows-latest
            profile: qwen
          - os: ubuntu-latest
            profile: marathon
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      MPDOC_EVAL_NPROC: '1'
      MPDOC_DOC_BUDGET: '0'
      MPDOC_TEDS_NPROC: '1'
      MPDOC_TEDS_TIMEOUT: '300'
      MPDOC_CDM_NPROC: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.b/pip-cache
      MPLCONFIGDIR: ${{ github.workspace }}/.b/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements/benchmark-scorer.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python scripts/check_official_scorer.py --profile ${{ matrix.profile }} --source .b/scorer --output .b/scorer-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-scorer-${{ matrix.os }}-${{ matrix.profile }}
          path: .b/scorer-check
          include-hidden-files: true
