[build-system]
requires = ["setuptools==81.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unlimited-ocr-2-rocm"
version = "0.0.1.dev0"
description = "Baidu Unlimited OCR 2 on AMD ROCm — native inference, long-document parsing, and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{name = "AIwork4me"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.10",
]

[project.scripts]
unlimited-ocr2-rocm = "unlimited_ocr_2_rocm.cli:main"

[project.urls]
Repository = "https://github.com/AIwork4me/Unlimited-OCR-2-ROCm"
Issues = "https://github.com/AIwork4me/Unlimited-OCR-2-ROCm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unlimited_ocr_2_rocm = ["upstream-lock.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["gpu: opt-in physical Windows gfx1151 execution"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
